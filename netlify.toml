# Netlify: o app Vite mora em gerador-boletins/, e o roteamento e client-side (SPA).
[build]
  base = "gerador-boletins"
  command = "npm run build"
  publish = "dist"

# Sem isto, recarregar ou acessar /boletins, /alunos etc. direto retorna 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
