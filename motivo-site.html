<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motivo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        stone: {
          950: '#0c0a09',
          900: '#1c1917',
          800: '#292524',
          700: '#44403c',
          600: '#57534e',
          500: '#78716c',
          400: '#a8a29e',
          300: '#d6d3d1',
          200: '#e7e5e4',
          100: '#f5f5f4',
        }
      }
    }
  }
}
</script>
<style>
  body { background: #0c0a09; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, createContext, useContext } = React;

// ════════════════════════════════════════════════════════════
// ROUTER  —  hash-based, sem dependência externa
// ════════════════════════════════════════════════════════════
const RouterCtx = createContext(null);

function useRouter() { return useContext(RouterCtx); }

function Router({ children }) {
  const [path, setPath] = useState("/");
  function navigate(to) { setPath(to); window.scrollTo({ top: 0, behavior: "smooth" }); }
  return <RouterCtx.Provider value={{ path, navigate }}>{children}</RouterCtx.Provider>;
}

function Route({ match, children }) {
  const { path } = useRouter();
  return path === match ? children : null;
}

// ════════════════════════════════════════════════════════════
// ICONS  —  SVG inline minimalistas
// ════════════════════════════════════════════════════════════
const ArrowRight = ({ size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
  </svg>
);
const ChevronRight = ({ size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="9 18 15 12 9 6"/>
  </svg>
);
const MenuIcon = ({ size = 20 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
);
const CloseIcon = ({ size = 20 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
);

// ════════════════════════════════════════════════════════════
// UI PRIMITIVES
// ════════════════════════════════════════════════════════════
function Container({ children, className = "" }) {
  return <div className={`max-w-5xl mx-auto px-6 ${className}`}>{children}</div>;
}

function Section({ children, className = "" }) {
  return <section className={`py-20 ${className}`}>{children}</section>;
}

function Button({ children, variant = "primary", onClick, className = "" }) {
  const styles = {
    primary: "bg-amber-500 text-stone-950 hover:bg-amber-400 font-semibold",
    outline: "border border-stone-600 text-stone-300 hover:border-amber-500 hover:text-amber-400",
    ghost:   "text-stone-400 hover:text-stone-100",
  };
  return (
    <button onClick={onClick} className={`inline-flex items-center gap-2 px-5 py-2.5 text-sm transition-colors duration-150 ${styles[variant]} ${className}`}>
      {children}
    </button>
  );
}

function Badge({ children }) {
  return (
    <span className="inline-block px-3 py-1 text-xs font-medium text-amber-400 border border-amber-800 bg-amber-950 rounded-full">
      {children}
    </span>
  );
}

function Card({ children, className = "" }) {
  return <div className={`border border-stone-800 bg-stone-900 p-6 ${className}`}>{children}</div>;
}

function Skeleton({ className = "" }) {
  return <div className={`bg-stone-800 rounded animate-pulse ${className}`} />;
}

// ════════════════════════════════════════════════════════════
// LAYOUT — Header
// ════════════════════════════════════════════════════════════
const NAV = [
  { label: "Início",       path: "/" },
  { label: "Missão",       path: "/missao" },
  { label: "Impacto",      path: "/impacto" },
  { label: "Comunidade",   path: "/comunidade" },
  { label: "Contato",      path: "/contato" },
];

function Logo() {
  const { navigate } = useRouter();
  return (
    <button onClick={() => navigate("/")} className="flex items-center gap-2.5">
      <div className="w-6 h-6 bg-amber-500 flex items-center justify-center">
        <div className="w-2 h-2 bg-stone-950 rounded-full" />
      </div>
      <span className="text-stone-100 font-bold tracking-tight text-base">motivo</span>
    </button>
  );
}

function Header() {
  const { path, navigate } = useRouter();
  const [open, setOpen] = useState(false);
  return (
    <header className="fixed top-0 left-0 right-0 z-50 border-b border-stone-800" style={{ backgroundColor: 'rgba(12,10,9,0.95)', backdropFilter: 'blur(8px)' }}>
      <Container>
        <div className="flex items-center justify-between py-4">
          <Logo />
          <nav className="hidden md:flex items-center gap-1">
            {NAV.map(n => (
              <button key={n.path} onClick={() => navigate(n.path)}
                className={`px-3 py-1.5 text-sm transition-colors ${path === n.path ? "text-amber-400" : "text-stone-400 hover:text-stone-100"}`}>
                {n.label}
              </button>
            ))}
          </nav>
          <div className="hidden md:flex items-center gap-3">
            <Button variant="ghost">Entrar</Button>
            <Button variant="primary">Participar <ChevronRight size={14} /></Button>
          </div>
          <button className="md:hidden text-stone-400 hover:text-stone-100" onClick={() => setOpen(!open)}>
            {open ? <CloseIcon /> : <MenuIcon />}
          </button>
        </div>
      </Container>
      {open && (
        <div className="md:hidden border-t border-stone-800 bg-stone-950 px-6 py-4 space-y-1">
          {NAV.map(n => (
            <button key={n.path} onClick={() => { navigate(n.path); setOpen(false); }}
              className="block w-full text-left py-2.5 text-sm text-stone-300 hover:text-amber-400 transition-colors">
              {n.label}
            </button>
          ))}
          <div className="pt-3 space-y-2">
            <Button variant="outline" className="w-full justify-center">Entrar</Button>
            <Button variant="primary" className="w-full justify-center">Participar</Button>
          </div>
        </div>
      )}
    </header>
  );
}

// ════════════════════════════════════════════════════════════
// LAYOUT — Footer
// ════════════════════════════════════════════════════════════
const FOOTER_COLS = {
  Movimento:   ["Sobre", "Missão", "Equipe", "Transparência"],
  Iniciativas: ["Projetos", "Impacto", "Parceiros", "Relatórios"],
  Comunidade:  ["Participar", "Voluntários", "Doações", "Newsletter"],
  Legal:       ["Privacidade", "Termos"],
};

function Footer() {
  return (
    <footer className="border-t border-stone-800 bg-stone-950 pt-14 pb-8">
      <Container>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-8 pb-12">
          <div className="col-span-2 md:col-span-1">
            <Logo />
            <p className="mt-4 text-sm text-stone-500 leading-relaxed">
              Uma plataforma para quem quer transformar propósito em ação real.
            </p>
          </div>
          {Object.entries(FOOTER_COLS).map(([group, links]) => (
            <div key={group}>
              <p className="text-xs font-semibold text-stone-400 mb-3">{group}</p>
              <ul className="space-y-2">
                {links.map(l => (
                  <li key={l}>
                    <button className="text-sm text-stone-500 hover:text-stone-300 transition-colors">{l}</button>
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div className="border-t border-stone-800 pt-6 flex flex-col md:flex-row items-center justify-between gap-3">
          <p className="text-xs text-stone-600">© 2026 Motivo. Todos os direitos reservados.</p>
          <div className="flex gap-5">
            {["Instagram", "LinkedIn", "YouTube"].map(s => (
              <button key={s} className="text-xs text-stone-600 hover:text-stone-400 transition-colors">{s}</button>
            ))}
          </div>
        </div>
      </Container>
    </footer>
  );
}

// ════════════════════════════════════════════════════════════
// LAYOUT — Shell
// ════════════════════════════════════════════════════════════
function AppLayout({ children }) {
  return (
    <div className="min-h-screen bg-stone-950 text-stone-100">
      <Header />
      <main style={{ paddingTop: '61px' }}>{children}</main>
      <Footer />
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// HOME — Seções
// ════════════════════════════════════════════════════════════
function HeroSection() {
  const { navigate } = useRouter();
  return (
    <Section className="min-h-screen flex items-center border-b border-stone-800">
      <Container>
        <div className="max-w-2xl">
          <Badge>Movimento ativo · 2026</Badge>
          <h1 className="mt-6 text-6xl md:text-7xl font-bold text-stone-100 leading-none tracking-tight">
            Encontre seu<br /><span className="text-amber-400">motivo.</span>
          </h1>
          <p className="mt-6 text-lg text-stone-400 leading-relaxed max-w-lg">
            Uma plataforma para causas que importam. Conectamos pessoas, amplificamos
            vozes e construímos impacto coletivo — com transparência radical.
          </p>
          <div className="mt-10 flex flex-wrap gap-4">
            <Button onClick={() => navigate("/missao")}>Nossa missão <ArrowRight size={15} /></Button>
            <Button variant="outline" onClick={() => navigate("/impacto")}>Ver impacto</Button>
          </div>
        </div>
      </Container>
    </Section>
  );
}

function StatsSection() {
  const stats = [
    { value: "42k", label: "Pessoas alcançadas" },
    { value: "128", label: "Projetos ativos" },
    { value: "93%", label: "Taxa de engajamento" },
    { value: "17",  label: "Cidades parceiras" },
  ];
  return (
    <Section className="border-b border-stone-800">
      <Container>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-10">
          {stats.map(({ value, label }) => (
            <div key={label}>
              <p className="text-4xl font-bold text-amber-400">{value}</p>
              <p className="mt-1 text-sm text-stone-500">{label}</p>
            </div>
          ))}
        </div>
      </Container>
    </Section>
  );
}

function MissionPreviewSection() {
  const pillars = [
    { title: "Transparência radical", desc: "Dados abertos, contas públicas." },
    { title: "Impacto mensurável",    desc: "Métricas reais, não vaidade." },
    { title: "Comunidade ativa",      desc: "Pessoas, não seguidores." },
  ];
  return (
    <Section className="border-b border-stone-800">
      <Container>
        <div className="grid md:grid-cols-2 gap-16 items-start">
          <div>
            <p className="text-amber-500 text-sm font-medium mb-4">Quem somos</p>
            <h2 className="text-3xl font-bold text-stone-100 leading-tight mb-5">
              Toda causa merece uma estrutura que funciona
            </h2>
            <p className="text-stone-400 leading-relaxed mb-8">
              Motivo nasceu da frustração com plataformas que prometem impacto mas entregam
              engajamento vazio. Construímos ferramentas para quem quer agir — não apenas compartilhar.
            </p>
            <button className="inline-flex items-center gap-2 text-sm text-amber-400 hover:text-amber-300 transition-colors">
              Conhecer a história <ArrowRight size={15} />
            </button>
          </div>
          <div className="space-y-3">
            {pillars.map(({ title, desc }) => (
              <Card key={title}>
                <div className="flex items-start gap-4">
                  <div className="mt-1 flex-shrink-0" style={{ width: '2px', height: '40px', background: '#f59e0b' }} />
                  <div>
                    <p className="text-stone-100 font-medium">{title}</p>
                    <p className="text-stone-500 text-sm mt-0.5">{desc}</p>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        </div>
      </Container>
    </Section>
  );
}

function CtaSection() {
  const { navigate } = useRouter();
  return (
    <Section>
      <Container>
        <div className="bg-amber-500 p-12 md:p-16 text-center">
          <h2 className="text-3xl md:text-4xl font-bold text-stone-950 mb-3">
            Qual é o seu motivo?
          </h2>
          <p className="text-amber-900 mb-8 max-w-md mx-auto text-sm">
            Junte-se a quem está transformando propósito em ação.
          </p>
          <button onClick={() => navigate("/comunidade")}
            className="inline-flex items-center gap-2 px-5 py-2.5 text-sm border-2 border-stone-950 text-stone-950 hover:bg-stone-950 hover:text-amber-400 transition-colors font-semibold">
            Começar agora <ArrowRight size={15} />
          </button>
        </div>
      </Container>
    </Section>
  );
}

function HomePage() {
  return (
    <>
      <HeroSection />
      <StatsSection />
      <MissionPreviewSection />
      <CtaSection />
    </>
  );
}

// ════════════════════════════════════════════════════════════
// PAGES — Placeholder para telas futuras
// ════════════════════════════════════════════════════════════
function PlaceholderPage({ title, subtitle, blocks = 3 }) {
  return (
    <Section className="min-h-screen">
      <Container>
        <div className="max-w-2xl">
          <Badge>Em construção</Badge>
          <h1 className="mt-5 text-4xl font-bold text-stone-100">{title}</h1>
          <p className="mt-3 text-stone-400 leading-relaxed">{subtitle}</p>
          <div className="mt-12 space-y-4">
            {Array.from({ length: blocks }).map((_, i) => (
              <Skeleton key={i} className={`h-28`} style={{ opacity: 1 - i * 0.2 }} />
            ))}
          </div>
        </div>
      </Container>
    </Section>
  );
}

const MissaoPage    = () => <PlaceholderPage title="Nossa Missão"  subtitle="Manifesto, valores e a história por trás do movimento. Em desenvolvimento." />;
const ImpactoPage   = () => <PlaceholderPage title="Impacto"       subtitle="Dados abertos, relatórios e histórias reais. Em desenvolvimento." blocks={4} />;
const ComunidadePage= () => <PlaceholderPage title="Comunidade"    subtitle="Conheça quem está por trás do movimento e como participar. Em desenvolvimento." />;
const ContatoPage   = () => <PlaceholderPage title="Contato"       subtitle="Formulários, canais e parcerias. Em desenvolvimento." blocks={2} />;

// ════════════════════════════════════════════════════════════
// APP ROOT
// ════════════════════════════════════════════════════════════
function App() {
  return (
    <Router>
      <AppLayout>
        <Route match="/">          <HomePage />         </Route>
        <Route match="/missao">    <MissaoPage />       </Route>
        <Route match="/impacto">   <ImpactoPage />      </Route>
        <Route match="/comunidade"><ComunidadePage />   </Route>
        <Route match="/contato">   <ContatoPage />      </Route>
      </AppLayout>
    </Router>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
